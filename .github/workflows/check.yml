name: Validate static site
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required assets
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/projects.js
          test -s Dockerfile
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/projects.js
          node --check assets/config.js
