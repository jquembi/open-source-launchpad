name: Validate Ponte Solidária
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend and API
        run: npm run check
      - name: Verify project files
        run: |
          test -s index.html
          test -s admin.html
          test -s worker/schema.sql
          test -s wrangler.toml
